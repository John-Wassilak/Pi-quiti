# Pi-quiti behind nginx at /pi-quiti/.
# Include this inside an existing server { } block, and set in .env:
#   GRAFANA_ROOT_URL=http://<host>/pi-quiti/
#   GRAFANA_SERVE_FROM_SUB_PATH=true
#   GRAFANA_BIND=127.0.0.1
# proxy_pass has no URI part, so the /pi-quiti/ prefix is passed through;
# Grafana strips it itself when serve_from_sub_path is on.

location = /pi-quiti {
    return 301 /pi-quiti/;
}

location /pi-quiti/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3000;
}

# Grafana Live (websockets).
location /pi-quiti/api/live/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:3000;
}
