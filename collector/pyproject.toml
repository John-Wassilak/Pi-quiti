[project]
name = "piquiti"
version = "0.1.0"
description = "UniFi-style traffic view built from Pi-hole query logs"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
    "tldextract>=5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
piquiti = "piquiti.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["piquiti"]
